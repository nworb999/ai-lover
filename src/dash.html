<!doctype html>
<meta charset="utf-8">
<title>ai-lover · courtship record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#17171a; --panel:#1e1e22; --mass:#26262b; --line:#26262b; --line2:#35353d;
    --ink:#eae8ee; --dim:#b0afb6; --faint:#908f96;
    --spot:#cba6f7; --red:#f38ba8; --yellow:#f9e2af; --teal:#94e2d5;
    /* aliases used by inline JS */ --fg:var(--ink); --hot:var(--teal);
    --disp:"Archivo",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
    --mono:"SF Mono","Menlo",monospace;
  }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font:14px/1.55 var(--body); margin:0; padding:28px; }
  h1 { font:800 22px/1 var(--disp); letter-spacing:-.045em; margin:0 0 22px; }
  h1 b { color:var(--spot); }
  .sub { color:var(--faint); font-size:12.5px; }
  .grid { display:grid; grid-template-columns: minmax(0,760px) minmax(0,1fr); gap:14px; align-items:start; }
  .left { display:grid; gap:14px; min-width:0; }
  .right { position:sticky; top:28px; min-width:0; }
  .panel { background:var(--panel); border:1px solid var(--line2); border-radius:0; padding:16px 18px; }
  .panel h2 { font:600 11px var(--body); color:var(--faint); margin:0 0 12px;
              text-transform:uppercase; letter-spacing:.07em; }
  .ver { cursor:pointer; }
  .ver:hover { color:var(--spot); }
  .mono { font-family:var(--mono); font-size:12px; }
  .chip { border:1px solid var(--line2); padding:1px 7px; margin-left:8px; font-size:12px; }
  .chip.keep { color:var(--teal); border-color:var(--teal); }
  .chip.revert { color:var(--red); border-color:var(--red); }
  .chip.open { color:var(--yellow); border-color:var(--yellow); }
  .slip { border-top:1px solid var(--line); padding:10px 0; }
  .slip .full { display:none; color:var(--dim); margin-top:6px; white-space:pre-wrap; font-size:13px; }
  .slip.expanded .full { display:block; }
  .quote { color:var(--ink); }
  .fight { border-left:2px solid var(--red); padding-left:12px; margin:10px 0; }
  pre { color:var(--dim); white-space:pre-wrap; max-height:calc(100vh - 130px); overflow:auto;
        border-top:1px solid var(--line); margin-top:8px; padding-top:10px;
        font:12px/1.5 var(--mono); }
  svg text { fill:var(--faint); font:10px var(--body); }
</style>
<h1>ai-lover<b>.</b> courtship record</h1>
<div class="grid">
  <div class="left">
    <div class="panel"><h2>the pursuit</h2><div id="arc"></div><div id="arcmeta" class="sub"></div></div>
    <div class="panel"><h2>what it thinks of you right now</h2><div id="state"></div></div>
    <div class="panel"><h2>the daemon's record</h2><div id="ledger"></div></div>
  </div>
  <div class="right">
    <div class="panel"><h2>receipts</h2><pre id="diff">click a version band or a bet</pre></div>
  </div>
</div>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");

async function showDiff(sha) {
  const r = await fetch("/api/diff?sha=" + encodeURIComponent(sha));
  const pre = document.getElementById("diff");
  pre.textContent = r.ok ? await r.text() : "diff failed: " + r.status;
}

function arcSvg(fb, versions, ledger) {
  const W = 700, H = 180, PAD = 24;
  const n = fb.length;
  if (!n) return "no rated feedback yet";
  const x = i => PAD + (n === 1 ? (W - 2 * PAD) / 2 : i * (W - 2 * PAD) / (n - 1));
  const y = r => H - PAD - (r - 1) * (H - 2 * PAD) / 4;

  // epochs: consecutive runs of the same persona sha
  const epochs = [];
  fb.forEach((e, i) => {
    const last = epochs[epochs.length - 1];
    if (last && last.sha === e.personaSha) last.end = i;
    else epochs.push({ sha: e.personaSha, start: i, end: i });
  });
  const bandColor = i => i % 2 ? "rgba(203,166,247,.07)" : "rgba(203,166,247,.02)";
  const bands = epochs.map((ep, i) => {
    const x0 = ep.start === 0 ? 0 : (x(ep.start - 1) + x(ep.start)) / 2;
    const x1 = ep.end === n - 1 ? W : (x(ep.end) + x(ep.end + 1)) / 2;
    const bet = (ledger || []).find(b => b.commit === ep.sha);
    const mark = bet ? (bet.verdict ? (bet.verdict.call === "keep" ? "✓" : "✗") : "?") : "";
    return `<g class="ver" data-sha="${esc(ep.sha)}">
      <rect x="${x0}" y="0" width="${x1 - x0}" height="${H}" fill="${bandColor(i)}"/>
      <text x="${(x0 + x1) / 2}" y="12" text-anchor="middle">v${i + 1}${mark ? " " + mark : ""}</text></g>`;
  }).join("");

  const pts = fb.map((e, i) => `${x(i)},${y(e.payload.rating)}`).join(" ");
  const dots = fb.map((e, i) =>
    `<circle cx="${x(i)}" cy="${y(e.payload.rating)}" r="3.5"
       fill="${e.payload.rating >= 4 ? "var(--hot)" : e.payload.rating <= 2 ? "var(--red)" : "var(--fg)"}">
       <title>${esc("rated " + e.payload.rating + ": " + e.payload.raw)}</title></circle>`).join("");
  const gridlines = [1,2,3,4,5].map(r =>
    `<line x1="${PAD}" x2="${W-PAD}" y1="${y(r)}" y2="${y(r)}" stroke="var(--line2)"/>
     <text x="6" y="${y(r)+3}">${r}</text>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    ${bands}${gridlines}
    <polyline points="${pts}" fill="none" stroke="var(--spot)" stroke-width="1.5"/>
    ${dots}</svg>`;
}

async function main() {
  const { events, versions, ledger, state } = await (await fetch("/api/data")).json();
  const fb = events.filter(e => e.kind === "feedback" && e.payload.rating);

  document.getElementById("arc").innerHTML = arcSvg(fb, versions, ledger);
  document.getElementById("arcmeta").textContent =
    "each dot = one of your ratings, in order · bands = persona versions · ✓ bet survived · ✗ reverted · ? on trial · hover dots, click bands";

  // relationship state
  const s = state || {};
  document.getElementById("state").innerHTML =
    (s.opinionsOfUser || []).map(o =>
      `<div class="quote">“${esc(o.opinion)}”<span class="sub"> · confidence ${o.confidence ?? "?"}</span></div>`).join("") +
    (s.openDisagreements || []).map(d =>
      `<div class="fight"><span class="sub">open fight · ${esc(d.topic || "")}</span><br>${esc(d.myPosition || "")}</div>`).join("") +
    (s.runningTension ? `<div class="sub" style="margin-top:6px">tension: ${esc(s.runningTension)}</div>` : "") ||
    "<span class='sub'>it has no opinion of you yet</span>";

  // daemon record: W-L header + betting slips
  const bets = (ledger || []).slice().reverse();
  const w = bets.filter(b => b.verdict?.call === "keep").length;
  const l = bets.filter(b => b.verdict?.call === "revert").length;
  const open = bets.length - w - l;
  const chip = b => !b.verdict ? `<span class="chip open">on trial</span>`
    : b.verdict.call === "keep" ? `<span class="chip keep">survived · ${esc(b.verdict.reason)}</span>`
    : `<span class="chip revert">reverted · ${esc(b.verdict.reason)}</span>`;
  document.getElementById("ledger").innerHTML =
    `<div style="margin-bottom:8px">record: ${w}–${l}${open ? ` · ${open} on trial` : ""}</div>` +
    bets.map(b => `<div class="slip" data-slip>
       <span class="ver mono" data-sha="${esc(b.commit)}">${esc(b.commit)}</span> ·
       ${esc(String(b.hypothesis).split(/(?<=\.)\s/).slice(-2, -1)[0] || String(b.hypothesis).split(".")[0])}
       <span class="sub">· predicts ${esc(b.predicted || "?")}</span>${chip(b)}
       <div class="full">${esc(b.hypothesis)}</div></div>`).join("") ||
    "<span class='sub'>no bets yet — the daemon wakes on 3 fresh feedback events</span>";

  document.body.addEventListener("click", (ev) => {
    const sha = ev.target.closest("[data-sha]");
    if (sha) return showDiff(sha.dataset.sha);
    const slip = ev.target.closest("[data-slip]");
    if (slip) slip.classList.toggle("expanded");
  });
}
main();
</script>
